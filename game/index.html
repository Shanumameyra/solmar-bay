<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime Game</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #14100c;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #fff;
  }
  #game-root, #game-root canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  .hud-corner { position: absolute; }
  #hud-topleft { top: 14px; left: 16px; }
  .hud-cash {
    font-size: 30px;
    font-weight: 800;
    color: #7dff8a;
    letter-spacing: 1px;
  }
  .hud-stars {
    font-size: 24px;
    letter-spacing: 4px;
    color: #ffd21f;
    margin-top: 2px;
  }
  .hud-stars.flashing { animation: starflash .5s steps(2) infinite; }
  @keyframes starflash { 50% { opacity: .35; } }
  #minimap-wrap {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 160px;
    height: 160px;
    border: 2px solid rgba(255,255,255,.45);
    border-radius: 6px;
    overflow: hidden;
    background: #223022;
    box-shadow: 0 2px 12px rgba(0,0,0,.5);
  }
  #minimap-canvas { width: 160px; height: 160px; display: block; }
  #hud-bottomleft { bottom: 16px; left: 16px; width: 240px; }
  .hud-health-wrap {
    width: 220px;
    height: 14px;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 3px;
    overflow: hidden;
  }
  .hud-health-bar { height: 100%; width: 100%; background: #39d353; }
  .hud-health-bar.mid { background: #ffb020; }
  .hud-health-bar.low { background: #e5484d; }
  .hud-health-text { font-size: 13px; font-weight: 700; margin-top: 3px; }
  .hud-weapon { font-size: 15px; font-weight: 700; margin-top: 2px; color: #ffe9a8; }
  #hud-bottomcenter {
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: min(640px, 70vw);
  }
  .hud-dialogue {
    display: none;
    font-size: 15px;
    font-style: italic;
    color: #ffd21f;
    background: rgba(0,0,0,.45);
    border-radius: 6px;
    padding: 4px 10px;
    margin-bottom: 6px;
  }
  .hud-dialogue.show { display: inline-block; }
  .hud-objective { font-size: 17px; font-weight: 700; }
  .hud-distance { font-size: 13px; color: #cfe3ff; margin-top: 2px; }
  #hud-bottomright { bottom: 16px; right: 16px; text-align: right; }
  .hud-speed { font-size: 26px; font-weight: 800; }
  .hud-clock { font-size: 14px; color: #ffe9a8; }
  #hud-feed {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: min(560px, 60vw);
  }
  .feed-item {
    display: inline-block;
    background: rgba(0,0,0,.6);
    border-radius: 6px;
    padding: 5px 12px;
    margin: 3px auto;
    font-size: 14px;
    font-weight: 600;
    transition: opacity .8s;
  }
  .feed-item.feed-wanted { color: #ff8080; border: 1px solid #ff8080; }
  .feed-item.feed-mission { color: #ffd21f; border: 1px solid #ffd21f; }
  .feed-item.feed-taxi { color: #7dff8a; }
  .feed-item.feed-cash { color: #7dff8a; }
  .feed-item.feed-fail { color: #ff8080; }
  .feed-item.feed-heal { color: #7dff8a; }
  .feed-fade { opacity: 0; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 8, 6, .72);
    pointer-events: auto;
    text-align: center;
  }
  .hidden { display: none !important; }
  #title-screen {
    background: linear-gradient(180deg, rgba(20,12,4,.55) 0%, rgba(20,12,4,.82) 100%);
  }
  .title-inner { max-width: 620px; padding: 24px; }
  .title-logo {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #ffd21f;
    text-shadow: 0 3px 0 #7a1f2b, 0 8px 24px rgba(0,0,0,.8);
  }
  .title-tag { font-size: 17px; color: #ffe9a8; margin-top: 6px; }
  .title-press {
    font-size: 20px;
    font-weight: 800;
    margin: 22px 0 10px;
    letter-spacing: 2px;
  }
  .title-press.blink { animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .title-btn {
    pointer-events: auto;
    cursor: pointer;
    font-size: 17px;
    font-weight: 700;
    color: #14100c;
    background: #ffd21f;
    border: none;
    border-radius: 8px;
    padding: 12px 26px;
    margin: 6px;
    box-shadow: 0 3px 0 #a8840f;
  }
  .title-btn:hover { background: #ffe066; }
  .title-btn:active { transform: translateY(2px); box-shadow: none; }
  .title-controls {
    font-size: 14px;
    line-height: 1.7;
    color: #ddd;
    margin-top: 14px;
  }
  .title-blurb { font-size: 14px; font-style: italic; color: #bbb; margin-top: 14px; }
  .title-stats { font-size: 13px; color: #9fd6a8; margin-top: 10px; }
  .pause-title, .busted-text, .wasted-text {
    font-family: Georgia, serif;
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 8px;
  }
  .pause-title { color: #fff; }
  .busted-text { color: #4d9fff; text-shadow: 0 0 30px rgba(77,159,255,.8); }
  .wasted-text { color: #e5484d; text-shadow: 0 0 30px rgba(229,72,77,.8); }
  .busted-sub, .wasted-sub { font-size: 16px; color: #ddd; margin-top: 8px; }
  #busted-screen, #wasted-screen { background: rgba(10,8,6,.55); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="game-root"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
